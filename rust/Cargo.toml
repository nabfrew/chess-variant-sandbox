[package]
name = "chess-variant-sandbox-core"
version = "0.1.0"
edition = "2021"
description = "Move generation, search and tournament execution for the Chess variant sandbox harness"
license = "GPL-3.0-only"
publish = false

[lib]
name = "chess_variant_sandbox_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module"] }
rayon = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
