# Why each refused combination is refused: the one source (R-L1a; moved beside the tables by
# R-L1b, 2026-11-14, so that the package can read it). `refusals.reason_counts` reads `reason`
# for the counts `RULES.md` prints; `docs/reference/refusal-debt.md` is the record, and
# `uv run python docs/reference/refusal-debt.py` holds this file one-to-one against the code
# and says what it does not cover (`tests/test_refusal_debt.py` fails on it). A new refusal,
# in `refusals.py` or `schema.py`, gets its entry here in the same commit; a lift deletes it.
#
# [[refusal]]: one combination the validator refuses today.
#   id       this file's name for it: the row of `plan-schema-next.md` §2 it falls under (with a
#            suffix where a row holds several), or `<family>.<what>` for one outside that inventory
#   plan     that row's id; absent for a refusal the last inventory (the 192) did not hold
#   family   the rule that brings it
#   at       where the code says it: "table:<id>" or "table:<id>|<second>" for a row of
#            `spec/refusals.py`, else "<function>: <words of the message>" for a literal of
#            `spec/schema.py` (a list when two literals say one refusal; "=<words>" is a
#            literal that is exactly those words)
#   pair     the two things refused together, as key paths
#   reason   contradictory | too_expensive | not_built   (inert: refusing it loses nothing; not debt)
#   why      one line
#   held_by  not_built only: the task that will lift it, or "none"
#   cost, cost_basis   too_expensive only: the cost, and "cited: <where>" or "estimated"
#
# [[lifted]]: a row of the last inventory that is no longer refused (narrowed = true: a narrower
# case of it still is, and a [[refusal]] names it as its plan row), and lifts outside it.
#
# [other]: every other message-like literal of schema.py, so that a new one cannot go unread.
#   shape     a malformed spec: a type, a range, an unknown name, a square off the board
#   needs     a rule that needs another to mean anything (a dependency, not a refusal beside)
#   inert     a rule that could never fire here; the game meant is the game without it
#   spelling  one thing said twice, or two spellings of one key
#   fragment  part of another message, or not a refusal at all
# "<function> (N)" covers every literal in it that no "<function>: <words>" line or
# [[refusal]] claims, and says how many that is: a message added to the function (a refusal
# above all) changes the count and fails the check until it is named. A literal that reads
# like a pair is never covered that way.

